[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.8.5", features = ["tray-icon"] }
tauri-plugin-log = "2.7.0"
tauri-plugin-global-shortcut = "2.3.0"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
reqwest = { version = "0.11", features = ["json"] }
# Pin: time 0.3.52 hat die parse()-Signatur auf 2 Argumente geaendert und ist
# damit inkompatibel zu cookie 0.18.1 (transitiv ueber den reqwest 0.11-Baum).
# Ohne Cargo.lock wuerde der Resolver bei jedem Build die neueste (kaputte)
# time-Version ziehen. Pin kann entfallen, sobald reqwest auf >=0.12 gehoben wird.
time = "=0.3.51"

[dependencies.windows]
version = "0.52"
features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]
