<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">Aufnahme…</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: transparent;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }

        .container {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 16px 20px;
            width: 616px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9);
            border: 1px solid #2a2a2a;
        }

        .top-section {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .recording-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #3b82f6;
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.9); }
        }

        .status-text {
            color: #666;
            font-size: 11px;
            margin-left: auto;
        }

        .visualizer-container {
            background: transparent;
            border-radius: 8px;
            padding: 12px 0;
            margin-bottom: 12px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }

        .visualizer-bar {
            width: 3px;
            background: #3b82f6;
            border-radius: 1.5px;
            transition: height 0.08s ease;
            height: 3px;
            min-height: 3px;
        }

        .loading .visualizer-bar {
            animation: wave 1.2s ease-in-out infinite;
        }

        @keyframes wave {
            0%, 100% { height: 3px; }
            50% { height: 30px; }
        }

        .buttons {
            display: flex;
            gap: 16px;
            justify-content: flex-end;
        }

        button {
            padding: 6px 16px;
            border: none;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 400;
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s, background-color 0.2s;
            background: transparent;
            color: #666;
        }

        button:hover {
            color: #999;
        }

        button:focus-visible {
            outline: 2px solid #3b82f6;
            outline-offset: 2px;
        }

        .stop-btn {
            border: 1px solid #3a3a3a;
        }

        .stop-btn:hover {
            border-color: #4a4a4a;
        }

        .cancel-btn {
            border: 1px solid #2a2a2a;
        }

        .cancel-btn:hover {
            border-color: #3a3a3a;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-section">
            <div class="recording-indicator">
                <div class="dot" aria-hidden="true"></div>
            </div>
            <div class="status-text" id="statusText" aria-live="polite">Aufnahme…</div>
        </div>
        <div class="visualizer-container" id="visualizer" aria-hidden="true">
            <!-- Bars will be created dynamically -->
        </div>
        <div class="buttons">
            <button class="stop-btn" id="stopBtn" onclick="stopRecording()">Stop   Ctrl+\</button>
            <button class="cancel-btn" id="cancelBtn" onclick="cancelRecording()">Cancel   Esc</button>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'http://127.0.0.1:8765';

        // ================= I18N (DE/EN) =================
        const I18N = {
            de: {
                'title': 'Aufnahme…',
                'status.recording': 'Aufnahme…',
                'status.processing': 'Verarbeite…',
                'status.ready': 'Bereit…',
                'stop': 'Stopp',
                'cancel': 'Abbrechen',
            },
            en: {
                'title': 'Recording…',
                'status.recording': 'Recording…',
                'status.processing': 'Processing…',
                'status.ready': 'Ready…',
                'stop': 'Stop',
                'cancel': 'Cancel',
            }
        };

        let currentLang = 'de';
        function t(key) {
            return (I18N[currentLang] && I18N[currentLang][key]) || key;
        }

        function applyLanguage(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.textContent = t(el.getAttribute('data-i18n'));
            });
            refreshStatusText();
            refreshButtons();
        }

        function initLanguage() {
            const saved = localStorage.getItem('uiLanguage');
            const detected = (navigator.language || '').toLowerCase().startsWith('de') ? 'de' : 'en';
            applyLanguage(saved || detected);
        }

        let bars = [];
        let audioLevelInterval = null;
        let waveAnimationInterval = null;

        // State management
        let currentState = 'idle'; // 'idle', 'recording', 'processing'
        let isRecording = false;

        // Phase 3E: Auto-Stopp bei Stille
        let autoStopEnabled = false;
        let autoStopSilence = 2.5;
        let silenceStopTriggered = false;
        let silencePollInterval = null;
        let recordingMode = 'toggle';

        // Sound Effects - using Web Audio API
        let soundEffectsEnabled = true;
        let soundVolume = 0.8;
        let audioContext = null;

        // Load sound settings from localStorage
        try {
            const savedSoundEffects = localStorage.getItem('soundEffects');
            const savedVolume = localStorage.getItem('volume');
            soundEffectsEnabled = savedSoundEffects !== 'false';
            soundVolume = savedVolume ? parseInt(savedVolume) / 100 : 0.8;
        } catch (e) {
            console.warn('Could not load sound settings:', e);
        }

        function playBeep(frequency, duration) {
            if (!soundEffectsEnabled) return;
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.frequency.value = frequency;
                oscillator.type = 'sine';

                const adjustedVolume = soundVolume * 0.3; // Max 30% volume
                gainNode.gain.setValueAtTime(adjustedVolume, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);

                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + duration);
            } catch (error) {
                console.error('❌ Error playing sound:', error);
            }
        }

        function playStartSound() {
            playBeep(800, 0.1); // Higher pitch, short beep
        }

        function playStopSound() {
            playBeep(400, 0.15); // Lower pitch, slightly longer beep
        }

        // Audio visualizer
        function initVisualizer() {
            const visualizer = document.getElementById('visualizer');
            const barCount = 80;

            for (let i = 0; i < barCount; i++) {
                const bar = document.createElement('div');
                bar.className = 'visualizer-bar';
                visualizer.appendChild(bar);
                bars.push(bar);
            }
        }

        // Poll backend for audio levels (echte Pegel via /audio_level)
        async function pollAudioLevels() {
            if (currentState !== 'recording') return;

            let level = 0;
            try {
                const response = await fetch(`${BACKEND_URL}/audio_level`);
                if (response.ok) {
                    const data = await response.json();
                    level = data.level || 0;
                }
            } catch (error) {
                // Backend nicht erreichbar - Stufe 0 belassen
            }
            updateVisualizerFromLevel(level);
        }

        function updateVisualizerFromLevel(level) {
            bars.forEach((bar, index) => {
                const offset = (index / bars.length) * Math.PI * 4;
                const wave = Math.sin(offset + Date.now() / 200) * 0.3 + 0.7;
                const height = Math.max(3, level * 40 * wave);
                bar.style.height = `${height}px`;
            });
        }

        // State management functions
        async function setState(newState) {
            currentState = newState;
            await updateUI();
        }

        function refreshStatusText() {
            const statusText = document.getElementById('statusText');
            if (currentState === 'recording') {
                statusText.textContent = t('status.recording');
            } else if (currentState === 'processing') {
                statusText.textContent = t('status.processing');
            } else {
                statusText.textContent = t('status.ready');
            }
        }

        function refreshButtons() {
            const toggleShortcut = shortcuts.toggle || 'Ctrl+\\';
            const cancelShortcut = shortcuts.cancel || 'Esc';
            document.getElementById('stopBtn').textContent = `${t('stop')}   ${toggleShortcut}`;
            document.getElementById('cancelBtn').textContent = `${t('cancel')}   ${cancelShortcut}`;
        }

        async function updateUI() {
            if (audioLevelInterval) {
                clearInterval(audioLevelInterval);
                audioLevelInterval = null;
            }
            if (waveAnimationInterval) {
                clearInterval(waveAnimationInterval);
                waveAnimationInterval = null;
            }

            switch (currentState) {
                case 'recording':
                    refreshStatusText();
                    audioLevelInterval = setInterval(pollAudioLevels, 100);
                    break;
                case 'processing':
                    refreshStatusText();
                    startProcessingAnimation();
                    break;
                case 'idle':
                default:
                    refreshStatusText();
                    resetBars();
                    break;
            }
        }

        function startProcessingAnimation() {
            let waveOffset = 0;
            waveAnimationInterval = setInterval(() => {
                if (currentState !== 'processing') {
                    clearInterval(waveAnimationInterval);
                    waveAnimationInterval = null;
                    return;
                }
                bars.forEach((bar, index) => {
                    const delay = (index / bars.length) * Math.PI * 2;
                    const height = 10 + Math.sin(waveOffset + delay) * 12 + 12;
                    bar.style.height = `${height}px`;
                });
                waveOffset += 0.15;
            }, 50);
        }

        function resetBars() {
            bars.forEach(bar => {
                bar.style.height = '3px';
            });
        }

        // Show processing state (called by Rust)
        function showProcessing() {
            setState('processing');
        }

        // Phase 3E: Auto-Stopp Settings + Silence-Polling (nur Toggle-Modus)
        async function loadAutoStopSettings() {
            try {
                const resp = await fetch(`${BACKEND_URL}/settings/auto-stop`);
                const data = await resp.json();
                autoStopEnabled = !!data.enabled;
                autoStopSilence = parseFloat(data.silence_seconds) || 2.5;
            } catch (e) {
                console.warn('Could not load auto-stop settings:', e);
            }
        }

        async function loadRecordingMode() {
            try {
                const { invoke } = window.__TAURI_INTERNALS__;
                recordingMode = await invoke('get_recording_mode');
            } catch (e) {
                recordingMode = 'toggle';
            }
        }

        async function checkSilence() {
            if (silenceStopTriggered) return;
            try {
                const resp = await fetch(`${BACKEND_URL}/recording/silence-status`);
                const data = await resp.json();
                if (data.recording && data.silence_seconds >= autoStopSilence) {
                    silenceStopTriggered = true;
                    stopSilencePolling();
                    console.log('⏱️ Silence detected - auto-stopping');
                    // Rust-Flow wie bei F9 (showProcessing + hide + transcribe + inject)
                    const { invoke } = window.__TAURI_INTERNALS__;
                    await invoke('cmd_stop_recording');
                }
            } catch (e) {
                // Backend nicht erreichbar - ignorieren
            }
        }

        function startSilencePolling() {
            if (silencePollInterval) {
                clearInterval(silencePollInterval);
            }
            silenceStopTriggered = false;
            silencePollInterval = setInterval(checkSilence, 500);
        }

        function stopSilencePolling() {
            if (silencePollInterval) {
                clearInterval(silencePollInterval);
                silencePollInterval = null;
            }
        }

        // Stop and transcribe
        async function stopRecording() {
            playStopSound();
            setState('processing');

            let transcribedText = null;

            try {
                const response = await fetch(`${BACKEND_URL}/stop`, { method: 'POST' });
                const data = await response.json();

                if (data.status === 'success' && data.text) {
                    transcribedText = data.text;
                }
            } catch (error) {
                console.error('❌ Stop error:', error);
            }

            // Hide window FIRST (to restore focus)
            const { webviewWindow, invoke } = window.__TAURI_INTERNALS__;
            await webviewWindow.getCurrent().hide();

            // Wait for focus to return to text field
            await new Promise(resolve => setTimeout(resolve, 150));

            // THEN inject text (always inject, clipboard setting controls saving)
            if (transcribedText) {
                try {
                    const saveToClipboard = await invoke('get_clipboard_paste');
                    await invoke('inject_text_directly', {
                        text: transcribedText,
                        saveToClipboard: saveToClipboard
                    });
                } catch (error) {
                    console.error('❌ Injection error:', error);
                }
            }
        }

        // Cancel recording
        async function cancelRecording() {
            try {
                await fetch(`${BACKEND_URL}/cancel`, { method: 'POST' });
            } catch (error) {
                console.error('❌ Cancel error:', error);
            }

            const { webviewWindow } = window.__TAURI_INTERNALS__;
            await webviewWindow.getCurrent().hide();
        }

        // Sync shortcuts from main window
        window.syncShortcutsFromRust = function(toggleShortcut, cancelShortcut) {
            shortcuts.toggle = toggleShortcut;
            shortcuts.cancel = cancelShortcut;
            refreshButtons();
        };

        // Sync sound settings from main window
        window.syncSoundSettings = function(enabled, volume) {
            soundEffectsEnabled = enabled;
            soundVolume = volume / 100;
            localStorage.setItem('soundEffects', enabled);
            localStorage.setItem('volume', volume);
        };

        // Shortcuts (default)
        let shortcuts = {
            toggle: 'Ctrl+\\',
            cancel: 'Esc'
        };

        async function loadShortcutsFromState() {
            try {
                const { invoke } = window.__TAURI_INTERNALS__;
                shortcuts.toggle = await invoke('get_toggle_shortcut');
                shortcuts.cancel = await invoke('get_cancel_shortcut');
                refreshButtons();
            } catch (error) {
                console.error('❌ Error loading shortcuts from state:', error);
            }
        }

        // Escape key cancels
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                e.preventDefault();
                cancelRecording();
            }
        });

        // Reset to recording state
        function resetToRecording() {
            playStartSound();
            setState('recording');
        }

        // Initialize on load
        initVisualizer();
        initLanguage();
        loadShortcutsFromState();

        // Track previous visibility state
        let wasVisible = false;
        let isFirstShow = true;

        // Poll visibility to start/stop monitoring
        setInterval(async () => {
            const { webviewWindow } = window.__TAURI_INTERNALS__;
            const currentWindow = webviewWindow.getCurrent();
            const isVisible = await currentWindow.isVisible();

            // Window just became visible
            if (isVisible && !wasVisible) {
                if (isFirstShow) {
                    isFirstShow = false;
                }
                loadShortcutsFromState();
                await loadAutoStopSettings();
                await loadRecordingMode();
                // Small delay to ensure window is fully shown
                setTimeout(() => {
                    resetToRecording();
                    // Phase 3E: Silence-Polling NUR im Toggle-Modus + wenn aktiviert
                    if (autoStopEnabled && recordingMode === 'toggle') {
                        startSilencePolling();
                    }
                }, 100);
            }
            // Window just became hidden
            else if (!isVisible && wasVisible) {
                setState('idle');
                stopSilencePolling();
                silenceStopTriggered = false;
            }

            wasVisible = isVisible;
        }, 300);
    </script>
</body>
</html>
