name: Build Windows Portable

# Phase 1: Baut PortableWhisper als portables ZIP (kein Installer, kein UAC).
# Pipeline:
#   1. Python-Backend mit PyInstaller (whisper-backend.spec) -> whisper-backend.exe
#   2. Sidecar mit Target-Triple-Suffix nach src-tauri/binaries/ kopieren
#   3. Tauri-App bauen (--no-bundle -> nur .exe, kein MSI/NSIS)
#   4. Portables ZIP zusammenstellen (.exe + binaries/ + Doku)
#   5. Als Artifact hochladen; bei Tags zusaetzlich als GitHub Release
#
# WICHTIG: Kein npm/Node-Schritt - das Frontend ist statisches HTML in
# frontend/dist/ (bereits eingecheckt, beforeBuildCommand ist leer).

on:
  push:
    branches: [main, phase-1, phase-1-2, phase-2, phase-3, phase-3b, phase-3b-kvcache-dml, phase-3c-qwen3, phase-3d-lemonade-gemma4]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Nur den neuesten Build pro Branch laufen lassen; aeltere laufende Builds
# bei neuem Push abbrechen (verhindert redundante Laufe nach Docs-Pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Windows Defender auf den Runnern quarantaent frisch gebaute
      # PyInstaller-Onefile-Exes (False Positive) und scannt beim Bundling
      # native DLLs (onnxruntime) -> kann den Analysis-Schritt blockieren.
      # Workspace UND die Python-Umgebung (hostedtoolcache) freigeben.
      - name: Exclude build paths from Defender
        run: |
          $paths = @($env:GITHUB_WORKSPACE, "C:\hostedtoolcache\windows\Python")
          foreach ($p in $paths) {
            try {
              Set-MpPreference -ExclusionPath $p -ErrorAction Stop
              Write-Host "Defender-Exclusion gesetzt fuer: $p"
            } catch {
              Write-Host "Defender-Exclusion nicht moeglich fuer $p : $($_.Exception.Message)"
            }
          }

      # ============================================================
      # 1. Python-Backend bauen (PyInstaller, ohne torch)
      # ============================================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements-portable.txt

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-portable.txt

      # Pre-flight: stellt sicher, dass die schweren ML-Imports außerhalb von
      # PyInstaller sauber laden (und nicht bereits hier haengen).
      # Phase 3D: tokenizers entfallen (LLM-Korrektur via Lemonade, nicht mehr onnxruntime-basiert)
      - name: Pre-flight import check
        working-directory: backend
        run: python -c "import onnx_asr, onnxruntime, huggingface_hub, requests; print('imports OK')"

      - name: Build Backend (PyInstaller)
        working-directory: backend
        run: pyinstaller --clean --log-level DEBUG whisper-backend.spec

      - name: Verify sidecar binary
        run: |
          Write-Host "--- Inhalt backend/dist ---"
          Get-ChildItem backend/dist -ErrorAction SilentlyContinue | Format-Table Name,Length
          if (-not (Test-Path backend/dist/whisper-backend.exe)) {
            throw "backend/dist/whisper-backend.exe fehlt (Defender? Build-Fehler?)"
          }
          Write-Host "Sidecar gebaut: $((Get-Item backend/dist/whisper-backend.exe).Length) Bytes"

      # ============================================================
      # 2. Sidecar ins Tauri-Binary-Verzeichnis legen (Triple-Suffix!)
      #    Tauri erwartet binaries/<name>-<target-triple>.exe
      # ============================================================
      - name: Stage sidecar for Tauri
        run: |
          New-Item -ItemType Directory -Force -Path frontend/src-tauri/binaries | Out-Null
          Copy-Item backend/dist/whisper-backend.exe `
            frontend/src-tauri/binaries/whisper-backend-x86_64-pc-windows-msvc.exe -Force
          Write-Host "Sidecar gestaged: frontend/src-tauri/binaries/whisper-backend-x86_64-pc-windows-msvc.exe"

      # ============================================================
      # 2b. Lemonade-Binary (Phase 3D: NPU-LLM-Korrektur via Gemma 4)
      #     Download von lemonade-sdk/lemonade GitHub Releases.
      #     TODO: Exakte Asset-Struktur klären (Installer-EXE entpacken oder
      #     direkte lemond.exe-Distribution). Aktuell: Placeholder-Schritt,
      #     der graceful überspringt, falls LEMONADE_RELEASE_URL nicht gesetzt ist.
      # ============================================================
      - name: Download Lemonade binary (lemond)
        run: |
          $url = $env:LEMONADE_RELEASE_URL
          if (-not $url) {
            Write-Host "⚠️ LEMONADE_RELEASE_URL nicht gesetzt — überspringe Lemonade-Download."
            Write-Host "   Die App läuft ohne LLM-Korrektur (NPU-Feature deaktiviert bis Binary verfügbar)."
            # Platzhalter-Datei, damit Tauri-Build nicht wegen fehlendem externalBin fehlschlägt
            New-Item -ItemType Directory -Force -Path frontend/src-tauri/binaries | Out-Null
            $placeholder = "frontend/src-tauri/binaries/lemond-x86_64-pc-windows-msvc.exe"
            if (-not (Test-Path $placeholder)) {
              Set-Content -Path $placeholder -Value "# placeholder until Lemonade binary is available"
            }
            Write-Host "Placeholder erstellt: $placeholder"
            return
          }
          Write-Host "Downloading Lemonade from: $url"
          $zip = "${{ runner.temp }}/lemonade.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          # TODO: Entpacken und lemond.exe extrahieren, sobald Asset-Struktur bekannt
          Expand-Archive -Path $zip -DestinationPath "${{ runner.temp }}/lemonade" -Force
          $lemond = Get-ChildItem -Recurse "${{ runner.temp }}/lemonade" -Filter "lemond.exe" | Select-Object -First 1
          if ($lemond) {
            Copy-Item $lemond.FullName "frontend/src-tauri/binaries/lemond-x86_64-pc-windows-msvc.exe" -Force
            Write-Host "Lemonade gestaged: frontend/src-tauri/binaries/lemond-x86_64-pc-windows-msvc.exe"
          } else {
            throw "lemond.exe nicht im Lemonade-Release gefunden"
          }
        env:
          LEMONADE_RELEASE_URL: ${{ secrets.LEMONADE_RELEASE_URL }}

      # ============================================================
      # 3. Tauri-App bauen (--no-bundle => nur .exe, kein Installer)
      # ============================================================
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
          # Cache-SAVE deaktiviert: das Komprimieren des mehr-GB target/-Verzeichnisses
          # eines Tauri-Builds dauert so lange, dass der Free-Tier-Runner die
          # Heartbeat-Verbindung verliert ("runner lost communication") und der
          # Job rot wird, obwohl alle Build-Schritte + Artifact-Upload erfolgreich
          # waren. Restore greift weiterhin auf fruehere Caches zurueck.
          save-if: false

      # Force-regenerate Cargo.lock: time 0.3.52 broke cookie 0.18.1 (parse()
      # Signatur). Cargo.toml pinnt time=0.3.51; generate-lockfile stellt sicher,
      # dass keine stale/restaurierte Lockfile die alte (kaputte) 0.3.52 uebrig behaelt.
      - name: Pin time crate (avoid 0.3.52 cookie breakage)
        working-directory: frontend/src-tauri
        run: |
          cargo generate-lockfile
          cargo update -p time --precise 0.3.51
          Write-Host "Pinned time to 0.3.51:" 
          (Select-String -Path Cargo.lock -Pattern 'name = "time"').Line
          (Select-String -Path Cargo.lock -Pattern 'name = "time"' -Context 0,1).Context.PostContext

      # Tauri-CLI als prebuilt Binary via npx (windows-latest hat Node vorinstalliert).
      # Schneller als 'cargo install tauri-cli' (das compiliert alles aus dem Source,
      # ~10-15 min). npx legt nur die native Binary vor.
      - name: Build Tauri app (portable, no bundle)
        working-directory: frontend/src-tauri
        run: npx --yes @tauri-apps/cli@latest build --no-bundle

      - name: Verify main exe
        run: |
          # --no-bundle laesst den Cargo-Binary-Namen stehen (app.exe);
          # der productName-Rename ("PortableWhisper.exe") passiert nur beim Bundling.
          $exe = "frontend/src-tauri/target/release/app.exe"
          Write-Host "--- target/release .exe Dateien ---"
          Get-ChildItem frontend/src-tauri/target/release -Filter *.exe -ErrorAction SilentlyContinue | Format-Table Name,Length
          if (-not (Test-Path $exe)) {
            throw "app.exe fehlt unter target/release (Tauri-Build fehlgeschlagen?)"
          }
          Write-Host "Main exe gebaut: $((Get-Item $exe).Length) Bytes"

      # ============================================================
      # 4. Portables ZIP zusammenstellen (flache Struktur, nur 1 Ebene)
      #    Struktur nach Entpacken:
      #      PortableWhisper.exe          (Tauri-Hauptapp, aus app.exe umbenannt)
      #      binaries/whisper-backend.exe
      #      model/                       (leer - User legt Modell ab)
      #      temp/, logs/                 (App-Daten, lokal im App-Ordner)
      #      README.md, LICENSE, LICENSES.md
      # ============================================================
      - name: Assemble portable ZIP
        run: |
          $stage = "${{ runner.temp }}/portable"
          New-Item -ItemType Directory -Force -Path "$stage/binaries" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/model" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/temp" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/logs" | Out-Null

          # Tauri baut mit --no-bundle die app.exe; fuer den Nutzer als
          # PortableWhisper.exe in das ZIP legen.
          Copy-Item frontend/src-tauri/target/release/app.exe "$stage/PortableWhisper.exe"
          Copy-Item frontend/src-tauri/binaries/whisper-backend-x86_64-pc-windows-msvc.exe "$stage/binaries/whisper-backend.exe"

          # Phase 3D: Lemonade-Sidecar (nur falls echte Binary vorhanden, nicht Placeholder)
          $lemondSrc = "frontend/src-tauri/binaries/lemond-x86_64-pc-windows-msvc.exe"
          if ((Test-Path $lemondSrc) -and ((Get-Item $lemondSrc).Length -gt 1KB)) {
            Copy-Item $lemondSrc "$stage/binaries/lemond.exe"
            Write-Host "Lemonade in ZIP aufgenommen"
          } else {
            Write-Host "⚠️ Lemonade-Binary ist Placeholder oder fehlt — nicht im ZIP enthalten"
          }

          Copy-Item README.md $stage/ -ErrorAction SilentlyContinue
          Copy-Item LICENSE $stage/ -ErrorAction SilentlyContinue
          Copy-Item LICENSES.md $stage/ -ErrorAction SilentlyContinue

          # Platzhalter-README im Modellordner, damit User weiss,
          # wohin die ONNX-Modell-Dateien gehören.
          Set-Content -Path "$stage/model/README.txt" -Value @"
          PortableWhisper - Modell-Ordner
          ==============================

          Legen Sie die Parakeet ONNX-Modell-Dateien direkt in diesen Ordner,
          damit PortableWhisper funktioniert.

          Empfohlenes Modell: NVIDIA Parakeet TDT 0.6B v3 (ONNX int4)
          Download: https://huggingface.co/efederici/parakeet-tdt-0.6b-v3-onnx-int4

          Erforderliche Dateien:
            - encoder-model.int4.onnx
            - decoder_joint-model.int8.onnx
            - vocab.txt

          Beispiel mit HuggingFace CLI:
            hf download efederici/parakeet-tdt-0.6b-v3-onnx-int4 `
              --local-dir model/

          Alternativ: int8-Modell von istupakov/parakeet-tdt-0.6b-v3-onnx
          Siehe README.md fuer Details.
          "@

          $version = "${{ github.ref_name }}"
          if ($version -notmatch '^v') {
            $sha = "${{ github.sha }}"
            $version = "dev-$($sha.Substring(0,7))"
          }
          $zip = "${{ runner.temp }}/PortableWhisper-$version-portable.zip"

          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          Write-Host "ZIP erstellt: $zip"
          Write-Host "--- ZIP-Inhalt ---"
          (Get-ChildItem -Recurse $stage).FullName
          "ZIP_PATH=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ============================================================
      # 5. Artifact + (bei Tags) GitHub Release
      # ============================================================
      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v6
        with:
          name: PortableWhisper-portable
          path: ${{ env.ZIP_PATH }}
          retention-days: 30

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ZIP_PATH }}
          generate_release_notes: true
